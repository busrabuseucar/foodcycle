name: ESP32 firmware build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sketch: [FoodCycleAI_ESP32_HX711, FoodCycleAI_HX711_Calibration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.1.18
      - name: Compile the pinned ESP32 target
        run: pio run -d firmware/${{ matrix.sketch }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.sketch }}-esp32devkit-v1
          path: firmware/${{ matrix.sketch }}/.pio/build/esp32doit-devkit-v1/firmware.bin
          if-no-files-found: error
